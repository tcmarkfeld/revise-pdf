[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/app"]

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
document = { path = "crates/document" }
pdf_source = { path = "crates/pdf_source" }
reconstruction = { path = "crates/reconstruction" }
fonts = { path = "crates/fonts" }
layout = { path = "crates/layout" }
editor = { path = "crates/editor" }
render = { path = "crates/render" }
export = { path = "crates/export" }

serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
base64 = "0.23"
pdfium-render = { version = "0.9.4", default-features = false, features = ["pdfium_7881", "image_latest", "thread_safe"] }
parley = "0.11.1"
swash = "0.2.10"
krilla = { version = "0.8.2", default-features = false, features = ["raster-images"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
unicode-segmentation = "1.13"
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "default_fonts", "accesskit"] }
egui = "0.36.2"
epaint = "0.36.2"
rfd = "0.17.2"
tiny-skia = "0.12"
etagere = "0.3"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
strip = true
